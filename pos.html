<!DOCTYPE html>
<html lang="en">
<head>
<script>
  (function(){
    var t = localStorage.getItem('ae_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
    document.documentElement.style.colorScheme = t;
  })();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Back Godown · Aadinath</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root { --radius: 10px; --radius-lg: 16px; --vh: 1vh; }
:root, [data-theme="dark"] {
  --bg: #060b14; --surface: #0d1525; --surface2: #141f35; --surface3: #1b2a47;
  --border: #1e3252; --border2: #2a4468; --accent: #34d399; --accent-dim: #10b981;
  --accent-glow: rgba(52,211,153,0.18); --text: #f0f6ff; --text2: #94aac4;
  --muted: #6a82a0; --danger: #fb7185; --danger-dim: rgba(251,113,133,0.14);
  --success: #34d399; --success-dim: rgba(52,211,153,0.14);
  --warn: #fcd34d; --warn-dim: rgba(252,211,77,0.14);
  --blue: #60c4fa; --blue-dim: rgba(96,196,250,0.14);
  --purple: #c084fc; --purple-dim: rgba(192,132,252,0.14);
  --shadow: 0 4px 20px rgba(0,0,0,0.55), 0 1px 4px rgba(0,0,0,0.3);
}
[data-theme="light"] {
  --bg: #eef2f7; --surface: #ffffff; --surface2: #f5f8fc; --surface3: #ebf0f7;
  --border: #d8e3ef; --border2: #bfcedd; --accent: #059669; --accent-dim: #047857;
  --accent-glow: rgba(5,150,105,0.12); --text: #0d1829; --text2: #1e3048;
  --muted: #5a7090; --danger: #dc2626; --danger-dim: rgba(220,38,38,0.09);
  --success: #059669; --success-dim: rgba(5,150,105,0.09);
  --warn: #b45309; --warn-dim: rgba(180,83,9,0.09);
  --blue: #0369a1; --blue-dim: rgba(3,105,161,0.09);
  --purple: #6d28d9; --purple-dim: rgba(109,40,217,0.09);
  --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: calc(var(--vh, 1vh) * 100); overflow: hidden; font-size: 14px; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

/* ── HEADER ── */
header { background: var(--surface); border-bottom: 1px solid var(--border); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(0,0,0,0.25); }
[data-theme="dark"] header { background: linear-gradient(135deg, #0d1525 0%, #0a1020 100%); }
.back-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.15s; flex-shrink: 0; font-family: 'DM Sans', sans-serif; }
.back-btn:hover { border-color: var(--border2); color: var(--text); }
.header-title { font-size: 16px; font-weight: 800; flex: 1; letter-spacing: -0.4px; }
.role-chip { font-size: 10px; font-weight: 700; padding: 3px 9px; border-radius: 5px; letter-spacing: 0.5px; text-transform: uppercase; flex-shrink: 0; }
.role-chip.admin { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(52,211,153,0.3); }
.role-chip.staff { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(96,196,250,0.3); }

/* ── BODY ── */
.pos-body { flex: 1; display: flex; overflow: hidden; }

/* ── SCAN BAR ── */
.scan-bar { padding: 10px 12px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: var(--surface); }
.scan-wrap { flex: 1; position: relative; }
.scan-wrap input { width: 100%; background: var(--surface2); border: 1.5px solid var(--accent); border-radius: var(--radius); color: var(--text); padding: 9px 12px 9px 36px; font-family: 'DM Mono', monospace; font-size: 13px; outline: none; transition: box-shadow 0.2s; }
.scan-wrap input:focus { box-shadow: 0 0 0 2px var(--accent-glow); }
.scan-wrap input::placeholder { color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px; }
.scan-ico { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 14px; pointer-events: none; }
.cam-btn { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text2); padding: 8px 11px; font-size: 18px; cursor: pointer; flex-shrink: 0; line-height: 1; transition: all 0.15s; }
.cam-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── PRODUCTS PANEL ── */
.products-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.search-bar { padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; position: relative; }
.search-bar input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 8px 12px 8px 34px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
.search-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-glow); }
.search-bar input::placeholder { color: var(--muted); }
.search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }
.location-row { display: flex; gap: 6px; padding: 8px 12px 6px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.loctab { flex: 1; padding: 7px 8px; text-align: center; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1.5px solid var(--border); background: var(--surface2); color: var(--muted); cursor: pointer; transition: all 0.15s; user-select: none; }
.loctab.active { border-color: var(--accent); background: var(--success-dim); color: var(--accent); }
.filter-row { display: flex; gap: 5px; padding: 7px 12px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.filter-row::-webkit-scrollbar { display: none; }
.ftab { padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.15s; flex-shrink: 0; user-select: none; }
.ftab.active { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); color: #fff; border-color: transparent; box-shadow: 0 2px 6px var(--accent-glow); }
.product-list { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.product-list::-webkit-scrollbar { width: 4px; }
.product-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── PRODUCT CARDS ── */
.prod-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 13px; display: flex; align-items: center; gap: 11px; transition: border-color 0.2s, transform 0.15s; box-shadow: var(--shadow); cursor: pointer; }
.prod-card:hover { border-color: var(--border2); transform: translateY(-1px); }
.prod-type { background: var(--surface2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; font-size: 9px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; align-self: flex-start; margin-top: 1px; }
.prod-info { flex: 1; min-width: 0; }
.prod-name { font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prod-sub { font-size: 11px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prod-stock-line { font-size: 10px; font-weight: 700; margin-top: 3px; }
.prod-stock-line.ok  { color: var(--muted); }
.prod-stock-line.low { color: var(--warn); }
.prod-stock-line.out { color: var(--danger); }

/* ── BACK STOCK COUNT IN CARD ── */
.stock-count-wrap { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.minus-btn, .plus-btn { width: 34px; height: 34px; border-radius: 8px; border: none; font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform 0.15s, background 0.15s; line-height: 1; }
.minus-btn { background: var(--danger-dim); color: var(--danger); border: 1.5px solid rgba(251,113,133,0.35); }
.minus-btn:hover { background: var(--danger); color: #fff; }
.plus-btn  { background: var(--success-dim); color: var(--accent); border: 1.5px solid rgba(52,211,153,0.35); }
.plus-btn:hover  { background: var(--accent); color: #fff; }
.minus-btn:active, .plus-btn:active { transform: scale(0.88); }
.back-qty-num { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; min-width: 28px; text-align: center; color: var(--text2); }

/* ── CAMERA OVERLAY ── */
.cam-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 600; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
.cam-overlay.active { display: flex; }
.cam-video { width: min(90vw,400px); height: min(58vh,300px); border-radius: 14px; object-fit: cover; border: 2px solid var(--accent); display: block; background: #000; }
.cam-guide { color: var(--text2); font-size: 13px; text-align: center; }
.cam-close { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 10px 28px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.cam-close:hover { border-color: var(--danger); color: var(--danger); }

/* ── UNIT TOGGLE ── */
.unit-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
.unit-btn { flex: 1; padding: 9px 12px; border-radius: 10px; border: 2px solid var(--border); background: var(--surface2); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; }
.unit-btn.active-piece { border-color: var(--accent); background: var(--success-dim); color: var(--accent); }
.unit-btn.active-box { border-color: var(--warn); background: var(--warn-dim); color: var(--warn); }

/* ── ADJUSTMENT BOTTOM SHEET ── */
.adj-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 300; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); }
.adj-overlay.active { display: flex; }
.adj-sheet { background: var(--surface); border: 1px solid var(--border2); border-radius: 22px 22px 0 0; width: 100%; max-width: 520px; padding: 0 20px calc(28px + env(safe-area-inset-bottom)); animation: slideUp 0.25s ease; }
@keyframes slideUp { from { transform: translateY(60px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.adj-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 14px auto 18px; }
.adj-prod-name { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
.adj-stock-info { font-size: 12px; color: var(--muted); margin-bottom: 18px; font-family: 'DM Mono', monospace; letter-spacing: 0.3px; }
.adj-section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 9px; }
.adj-options { display: flex; gap: 10px; margin-bottom: 20px; }
.adj-opt-btn { flex: 1; padding: 12px 8px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface2); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; text-align: center; line-height: 1.4; }
.adj-opt-btn .opt-icon { display: block; font-size: 24px; margin-bottom: 6px; }
.adj-opt-btn.sel-minus { border-color: var(--danger); background: var(--danger-dim); color: var(--danger); }
.adj-opt-btn.sel-plus  { border-color: var(--accent); background: var(--success-dim); color: var(--accent); }
.adj-qty-row { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.adj-qty-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.15s; }
.adj-qty-btn:hover { border-color: var(--accent); color: var(--accent); }
.adj-qty-inp { flex: 1; text-align: center; background: var(--surface2); border: 1.5px solid var(--border2); border-radius: 10px; color: var(--text); padding: 10px; font-size: 24px; font-weight: 800; font-family: 'DM Sans', sans-serif; outline: none; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.adj-qty-inp::-webkit-outer-spin-button, .adj-qty-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
.adj-qty-inp:focus { border-color: var(--accent); }
.adj-foot { display: flex; gap: 10px; }
.adj-cancel  { flex: 1; padding: 13px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; }
.adj-confirm { flex: 2; padding: 13px; border: none; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; color: #fff; transition: opacity 0.15s; }
.adj-confirm.minus { background: linear-gradient(135deg, #f43f5e, #e11d48); box-shadow: 0 4px 14px rgba(244,63,94,0.35); }
.adj-confirm.plus  { background: linear-gradient(135deg, var(--accent), var(--accent-dim)); box-shadow: 0 4px 14px var(--accent-glow); }
.adj-confirm:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }

/* ── TOAST ── */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px); background: var(--surface3); border: 1px solid var(--border2); color: var(--text); border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform 0.25s ease; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4); pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--success-dim); border-color: rgba(52,211,153,0.3); color: var(--accent); }
.toast.error   { background: var(--danger-dim);  border-color: rgba(251,113,133,0.3); color: var(--danger); }
.toast.info    { background: var(--blue-dim);    border-color: rgba(96,196,250,0.3);  color: var(--blue); }

/* ── LOADER ── */
.loader { display: flex; align-items: center; justify-content: center; padding: 40px 20px; color: var(--muted); gap: 8px; font-size: 13px; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MOBILE ── */
@media (max-width: 700px) {
  .product-list { padding-bottom: 20px; }
}

/* ── PRINT ── */
@media print { body { display: none; } }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← Back</a>
  <div class="header-title" id="headerTitle">📦 Back Godown</div>
  <span class="role-chip" id="roleChip"></span>
</header>

<div class="pos-body">
  <div class="products-panel" id="productsPanel">
    <div class="scan-bar">
      <div class="scan-wrap">
        <span class="scan-ico">⌨</span>
        <input type="text" id="barcodeInput" placeholder="Scan barcode / type SKU + Enter" autocomplete="off" autocorrect="off" spellcheck="false" onkeydown="onBarcodeKey(event)">
      </div>
      <button class="cam-btn" onclick="openCam()" title="Camera scan">📷</button>
    </div>
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by name, type, brand…" oninput="renderProducts()">
    </div>
    <div class="location-row">
      <div class="loctab active" id="ltab-back" onclick="setLocation('back',this)">📦 Back Godown</div>
      <div class="loctab" id="ltab-main" onclick="setLocation('main',this)">🏪 Main Store</div>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div class="product-list" id="productList">
      <div class="loader"><div class="spinner"></div> Loading…</div>
    </div>
  </div>
</div>

<!-- Camera Overlay -->
<div class="cam-overlay" id="camOverlay">
  <video id="camVideo" class="cam-video" autoplay muted playsinline></video>
  <div class="cam-guide">Point camera at barcode — detected automatically</div>
  <button class="cam-close" onclick="closeCam()">Close</button>
</div>

<!-- Adjustment Bottom Sheet -->
<div class="adj-overlay" id="adjOverlay" onclick="closeAdjOnBg(event)">
  <div class="adj-sheet">
    <div class="adj-handle"></div>
    <div class="adj-prod-name" id="adjProdName"></div>
    <div class="adj-stock-info" id="adjStockInfo"></div>
    <div id="adjUnitRow" style="display:none;gap:8px;margin-bottom:16px;"></div>
    <div class="adj-section-label" id="adjActionLabel"></div>
    <div class="adj-options" id="adjOptions"></div>
    <div class="adj-section-label" id="adjQtyLabel">Quantity</div>
    <div class="adj-qty-row">
      <button class="adj-qty-btn" onclick="adjChangeQty(-1)">−</button>
      <input type="number" class="adj-qty-inp" id="adjQtyInput" value="1" min="1" max="9999" inputmode="numeric">
      <button class="adj-qty-btn" onclick="adjChangeQty(1)">+</button>
    </div>
    <div class="adj-foot">
      <button class="adj-cancel" onclick="closeAdjModal()">Cancel</button>
      <button class="adj-confirm" id="adjConfirmBtn" onclick="confirmAdj()" disabled>Confirm</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function setVH() {
  let vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', vh + 'px');
}
setVH();
window.addEventListener('resize', setVH);
window.addEventListener('orientationchange', setVH);

const SUPABASE_URL = 'https://mculftdutoavwueluyma.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jdWxmdGR1dG9hdnd1ZWx1eW1hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0Mjk2NzAsImV4cCI6MjA5MDAwNTY3MH0.s-OLgLDXR5aN3uQlS5yAO2sk6Bot0TibtI4qFjrzZh4';
const H = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };

const _u = localStorage.getItem('ae_user') || 'admin';
const isAdmin = _u === 'admin';
const currentUserId = ({ admin: 1, akshat: 2 })[_u] || 1;

let allProducts = [], backStockMap = {}, mainStockMap = {}, backBoxMap = {}, mainBoxMap = {}, activeFilter = 'ALL', activeLocation = 'back';
let adjProductId = null, adjDirection = null, adjSelectedAction = null, adjUnit = 'piece';

// ── INIT ──────────────────────────────────────────────────────────────
async function init() {
  const chip = document.getElementById('roleChip');
  chip.textContent = isAdmin ? 'Admin' : 'Staff';
  chip.className = 'role-chip ' + (isAdmin ? 'admin' : 'staff');

  try {
    const [prodsRes, stockRes] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/products?select=*&active_status=eq.true&order=product_name.asc`, { headers: H }),
      fetch(`${SUPABASE_URL}/rest/v1/stock_by_location?select=product_id,quantity,box_quantity,location_id`, { headers: H })
    ]);
    allProducts = prodsRes.ok ? await prodsRes.json() : [];
    const stockRows = stockRes.ok ? await stockRes.json() : [];
    backStockMap = {};
    mainStockMap = {};
    backBoxMap = {};
    mainBoxMap = {};
    stockRows.forEach(r => {
      if (r.location_id === 2) {
        backStockMap[r.product_id] = (backStockMap[r.product_id] || 0) + (r.quantity || 0);
        if (r.box_quantity > 0) backBoxMap[r.product_id] = (backBoxMap[r.product_id] || 0) + r.box_quantity;
      }
      if (r.location_id === 1) {
        mainStockMap[r.product_id] = (mainStockMap[r.product_id] || 0) + (r.quantity || 0);
        if (r.box_quantity > 0) mainBoxMap[r.product_id] = (mainBoxMap[r.product_id] || 0) + r.box_quantity;
      }
    });
    buildFilters();
    renderProducts();
    setTimeout(() => document.getElementById('barcodeInput').focus(), 200);
  } catch(e) {
    document.getElementById('productList').innerHTML =
      `<div style="padding:24px;color:var(--danger);font-size:13px;">⚠ ${e.message}</div>`;
  }
}

// ── FILTERS ───────────────────────────────────────────────────────────
function setLocation(loc, el) {
  activeLocation = loc;
  document.querySelectorAll('.loctab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('headerTitle').textContent = loc === 'back' ? '📦 Back Godown' : '🏪 Main Store';
  activeFilter = 'ALL';
  buildFilters();
  renderProducts();
}

function buildFilters() {
  const sm = activeLocation === 'back' ? backStockMap : mainStockMap;
  const bm = activeLocation === 'back' ? backBoxMap   : mainBoxMap;
  const visible = allProducts.filter(p => (sm[p.product_id] || 0) > 0 || (bm[p.product_id] || 0) > 0);
  const types = ['ALL', ...new Set(visible.map(p => p.type).filter(Boolean).sort())];
  document.getElementById('filterRow').innerHTML = types.map(t =>
    `<div class="ftab${activeFilter === t ? ' active' : ''}" onclick="setFilter('${t.replace(/'/g, "\\'")}',this)">${t === 'ALL' ? 'All' : t}</div>`
  ).join('');
}

function setFilter(type, el) {
  activeFilter = type;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderProducts();
}

// ── RENDER ────────────────────────────────────────────────────────────
function renderProducts() {
  const sm  = activeLocation === 'back' ? backStockMap : mainStockMap;
  const bm  = activeLocation === 'back' ? backBoxMap   : mainBoxMap;
  const loc = activeLocation === 'back' ? 'back' : 'main';

  const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  let list = allProducts.filter(p => (sm[p.product_id] || 0) > 0 || (bm[p.product_id] || 0) > 0);
  if (activeFilter !== 'ALL') list = list.filter(p => p.type === activeFilter);
  if (q) list = list.filter(p =>
    (p.product_name || '').toLowerCase().includes(q) ||
    (p.type || '').toLowerCase().includes(q) ||
    (p.brand || '').toLowerCase().includes(q) ||
    (p.model || '').toLowerCase().includes(q) ||
    (p.stock_keeping_unit || '').toLowerCase().includes(q)
  );

  const el = document.getElementById('productList');
  if (!list.length) {
    el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;">No products with ${loc} godown stock</div>`;
    return;
  }

  el.innerHTML = list.map(p => {
    const qty    = sm[p.product_id] || 0;
    const bx     = bm[p.product_id] || 0;
    const _ut  = (p.unit_type       || '').trim().toLowerCase();
    const _uom = (p.unit_of_measure || '').trim().toLowerCase();
    const isBox  = (_ut === 'box' || _ut === 'boxes' || _uom === 'box' || _uom === 'boxes') && p.pieces_per_box > 0;
    const ppb    = p.pieces_per_box || 1;
    const total  = qty + bx * ppb;
    const reorder = p.reorder_level || 2;
    const stockCls = total <= reorder ? 'low' : 'ok';
    const stockTxt = isBox
      ? (bx > 0 ? `${bx} boxes + ${qty} pcs` : `${qty} pcs`)
      : (qty <= reorder ? `⚠ Low — ${qty} left` : `${qty} in ${loc}`);
    return `
      <div class="prod-card" onclick="openAdjModal(${p.product_id}, null)">
        <div class="prod-type">${p.type || '—'}</div>
        <div class="prod-info">
          <div class="prod-name">${p.product_name}</div>
          <div class="prod-sub">${[p.brand, p.model].filter(Boolean).join(' · ') || p.stock_keeping_unit || '—'}</div>
          <div class="prod-stock-line ${stockCls}">${stockTxt}</div>
        </div>
        <div class="stock-count-wrap">
          <button class="minus-btn" onclick="event.stopPropagation();openAdjModal(${p.product_id},'minus')" title="Reduce stock">−</button>
          <span class="back-qty-num">${isBox ? `${bx}bx` : total}</span>
          <button class="plus-btn"  onclick="event.stopPropagation();openAdjModal(${p.product_id},'plus')"  title="Add stock">+</button>
        </div>
      </div>`;
  }).join('');
}

// ── BARCODE ───────────────────────────────────────────────────────────
function onBarcodeKey(e) {
  if (e.key !== 'Enter') return;
  const code = e.target.value.trim();
  e.target.value = ''; e.target.focus();
  if (!code) return;
  const match = allProducts.find(p => (p.stock_keeping_unit || '').trim().toLowerCase() === code.toLowerCase())
             || allProducts.find(p => (p.product_name || '').toLowerCase().includes(code.toLowerCase()));
  if (!match) { showToast('No product found: ' + code, 'error'); return; }
  const _sm = activeLocation === 'back' ? backStockMap : mainStockMap;
  const _bm = activeLocation === 'back' ? backBoxMap   : mainBoxMap;
  if (!(_sm[match.product_id] > 0) && !(_bm[match.product_id] > 0)) { showToast(`Not in ${activeLocation === 'back' ? 'back' : 'main'} godown: ` + match.product_name, 'error'); return; }
  openAdjModal(match.product_id, 'minus');
}

// ── CAMERA ────────────────────────────────────────────────────────────
let zxingControls = null;

async function openCam() {
  document.getElementById('camOverlay').classList.add('active');
  const vid = document.getElementById('camVideo');
  try {
    const reader = new ZXing.BrowserMultiFormatReader();
    zxingControls = await reader.decodeFromConstraints(
      { video: { facingMode: { ideal: 'environment' } } },
      vid,
      (result, err) => {
        if (!result) return;
        closeCam();
        handleBarcodeResult(result.getText());
      }
    );
  } catch(e) {
    document.getElementById('camOverlay').classList.remove('active');
    const vid2 = document.getElementById('camVideo');
    if (vid2 && vid2.srcObject) { vid2.srcObject.getTracks().forEach(t => t.stop()); vid2.srcObject = null; }
    showToast('Camera: ' + e.message, 'error');
  }
}

function closeCam() {
  document.getElementById('camOverlay').classList.remove('active');
  if (zxingControls) { try { zxingControls.stop(); } catch(_) {} zxingControls = null; }
  const vid = document.getElementById('camVideo');
  if (vid && vid.srcObject) { vid.srcObject.getTracks().forEach(t => t.stop()); vid.srcObject = null; }
}

function handleBarcodeResult(code) {
  const match = allProducts.find(p => (p.stock_keeping_unit || '').trim().toLowerCase() === code.toLowerCase())
             || allProducts.find(p => (p.product_name || '').toLowerCase().includes(code.toLowerCase()));
  const _sm = activeLocation === 'back' ? backStockMap : mainStockMap;
  const _bm = activeLocation === 'back' ? backBoxMap   : mainBoxMap;
  if (match && (_sm[match.product_id] > 0 || _bm[match.product_id] > 0)) openAdjModal(match.product_id, 'minus');
  else if (match) showToast(`Not in ${activeLocation === 'back' ? 'back godown' : 'main store'}: ` + match.product_name, 'error');
  else showToast('No product found: ' + code, 'error');
}

// ── ADJUSTMENT MODAL ──────────────────────────────────────────────────
function getActions(direction) {
  if (activeLocation === 'main') {
    return direction === 'minus'
      ? [{ key: 'sold',      icon: '💰', label: 'Sold' },
         { key: 'to_back',   icon: '📦', label: 'Moved to Back Store' }]
      : [{ key: 'from_back', icon: '🔄', label: 'Moved to Front Store' },
         { key: 'stockin',   icon: '✅', label: 'Stock Added' }];
  }
  return direction === 'minus'
    ? [{ key: 'sold',      icon: '💰', label: 'Sold' },
       { key: 'to_front',  icon: '🏪', label: 'Moved to Front Store' }]
    : [{ key: 'from_main', icon: '🔄', label: 'Moved to Back Store' },
       { key: 'stockin',   icon: '✅', label: 'Stock Added' }];
}

function openAdjModal(productId, direction) {
  const p = allProducts.find(x => x.product_id === productId);
  if (!p) return;
  adjProductId      = productId;
  adjDirection      = direction || 'minus';
  adjSelectedAction = null;
  adjUnit           = 'piece';

  const backQty  = backStockMap[productId] || 0;
  const mainQty  = mainStockMap[productId] || 0;
  const bxBack   = backBoxMap[productId] || 0;
  const bxMain   = mainBoxMap[productId] || 0;
  const _ut2  = (p.unit_type       || '').trim().toLowerCase();
  const _uom2 = (p.unit_of_measure || '').trim().toLowerCase();
  const isBox    = (_ut2 === 'box' || _ut2 === 'boxes' || _uom2 === 'box' || _uom2 === 'boxes') && p.pieces_per_box > 0;
  const ppb      = p.pieces_per_box || 1;

  document.getElementById('adjProdName').textContent = p.product_name;
  document.getElementById('adjStockInfo').textContent = isBox
    ? `Back: ${bxBack}bx + ${backQty}pcs   ·   Main: ${bxMain}bx + ${mainQty}pcs`
    : `Back: ${backQty}   ·   Main: ${mainQty}`;
  document.getElementById('adjActionLabel').textContent = adjDirection === 'minus' ? 'What happened?' : 'Where is it from?';
  document.getElementById('adjQtyInput').value = 1;

  // Unit toggle (only for box products)
  const unitRow = document.getElementById('adjUnitRow');
  if (isBox) {
    unitRow.style.display = 'flex';
    unitRow.innerHTML = `
      <button class="unit-btn active-piece" id="unitBtnPiece" onclick="setAdjUnit('piece')">📌 Piece</button>
      <button class="unit-btn" id="unitBtnBox" onclick="setAdjUnit('box')">📦 Box (${ppb} pcs each)</button>`;
  } else {
    unitRow.style.display = 'none';
  }

  renderAdjOptions();
  document.getElementById('adjOverlay').classList.add('active');
}

function setAdjUnit(unit) {
  adjUnit = unit;
  const p = allProducts.find(x => x.product_id === adjProductId);
  const ppb = p ? (p.pieces_per_box || 1) : 1;
  document.getElementById('unitBtnPiece').className = 'unit-btn' + (unit === 'piece' ? ' active-piece' : '');
  document.getElementById('unitBtnBox').className   = 'unit-btn' + (unit === 'box'   ? ' active-box'   : '');
  document.getElementById('adjQtyLabel').textContent = unit === 'box' ? `Quantity (boxes · 1 box = ${ppb} pcs)` : 'Quantity';
  document.getElementById('adjQtyInput').value = 1;
}

function renderAdjOptions() {
  const cls = adjDirection === 'minus' ? 'sel-minus' : 'sel-plus';
  const actions = getActions(adjDirection);
  document.getElementById('adjOptions').innerHTML = actions.map(a => `
    <button class="adj-opt-btn${adjSelectedAction === a.key ? ' ' + cls : ''}"
            onclick="selectAdjAction('${a.key}')">
      <span class="opt-icon">${a.icon}</span>${a.label}
    </button>`).join('');
  const btn = document.getElementById('adjConfirmBtn');
  btn.className = 'adj-confirm ' + adjDirection;
  btn.disabled  = !adjSelectedAction;
}

function selectAdjAction(key) {
  adjSelectedAction = key;
  renderAdjOptions();
}

function adjChangeQty(delta) {
  const inp = document.getElementById('adjQtyInput');
  inp.value = Math.max(1, (parseInt(inp.value) || 1) + delta);
}

function closeAdjModal() {
  document.getElementById('adjOverlay').classList.remove('active');
  adjProductId = null; adjDirection = null; adjSelectedAction = null; adjUnit = 'piece';
}

function closeAdjOnBg(e) {
  if (e.target === document.getElementById('adjOverlay')) closeAdjModal();
}

async function confirmAdj() {
  if (!adjProductId || !adjSelectedAction) { showToast('Select an action first', 'error'); return; }
  const rawQty = parseInt(document.getElementById('adjQtyInput').value) || 0;
  if (rawQty < 1) { showToast('Enter a quantity', 'error'); return; }

  const p = allProducts.find(x => x.product_id === adjProductId);
  const ppb = p ? (p.pieces_per_box || 1) : 1;
  const isBoxUnit = adjUnit === 'box';

  const backQty = backStockMap[adjProductId] || 0;
  const mainQty = mainStockMap[adjProductId] || 0;
  const bxBack  = backBoxMap[adjProductId] || 0;
  const bxMain  = mainBoxMap[adjProductId] || 0;

  const locId   = activeLocation === 'back' ? 2 : 1;
  const otherId = activeLocation === 'back' ? 1 : 2;
  const curQty  = locId === 2 ? backQty : mainQty;
  const othQty  = locId === 2 ? mainQty : backQty;
  const curBox  = locId === 2 ? bxBack  : bxMain;
  const othBox  = locId === 2 ? bxMain  : bxBack;
  const locName = locId === 2 ? 'Back Godown' : 'Main Store';
  const othName = locId === 2 ? 'Main Store'  : 'Back Godown';

  // Validation
  const removesFromCur  = adjSelectedAction === 'sold' || adjSelectedAction === 'to_front' || adjSelectedAction === 'to_back';
  const removesFromOther = adjSelectedAction === 'from_main' || adjSelectedAction === 'from_back';
  if (removesFromCur) {
    if (isBoxUnit && rawQty > curBox) { showToast(`Only ${curBox} boxes in ${locName}`, 'error'); return; }
    if (!isBoxUnit && rawQty > curQty) { showToast(`Only ${curQty} pcs in ${locName}`, 'error'); return; }
  }
  if (removesFromOther) {
    if (isBoxUnit && rawQty > othBox) { showToast(`Only ${othBox} boxes in ${othName}`, 'error'); return; }
    if (!isBoxUnit && rawQty > othQty) { showToast(`Only ${othQty} pcs in ${othName}`, 'error'); return; }
  }

  const btn = document.getElementById('adjConfirmBtn');
  btn.disabled = true; btn.textContent = 'Saving…';

  try {
    const now    = new Date().toISOString();
    const movQty = isBoxUnit ? rawQty * ppb : rawQty;

    const noteMap = {
      sold:      `Sold from ${locName}`,
      to_front:  'Moved from Back Godown to Main Store',
      to_back:   'Moved from Main Store to Back Godown',
      from_back: 'Moved from Back Godown to Main Store',
      from_main: 'Moved from Main Store to Back Godown',
      stockin:   `Stock added to ${locName}`
    };
    const reqTypeMap = {
      sold: 'SALE', to_front: 'TRANSFER', to_back: 'TRANSFER',
      from_back: 'TRANSFER', from_main: 'TRANSFER', stockin: 'ADJUSTMENT_IN'
    };
    const note    = noteMap[adjSelectedAction];
    const reqType = reqTypeMap[adjSelectedAction];

    // ── STAFF PATH: submit pending request ──────────────────────────────
    if (!isAdmin) {
      const toLocForReq = (adjSelectedAction === 'to_front' || adjSelectedAction === 'from_back') ? 1
                        : (adjSelectedAction === 'to_back'  || adjSelectedAction === 'from_main') ? 2
                        : locId;
      const r = await fetch(`${SUPABASE_URL}/rest/v1/stock_requests`, {
        method: 'POST', headers: H,
        body: JSON.stringify({
          product_id:     adjProductId,
          quantity:       movQty,
          request_type:   reqType,
          notes:          note,
          requested_by:   currentUserId,
          to_location_id: toLocForReq,
          status:         'PENDING',
          requested_at:   now
        })
      });
      if (!r.ok) throw new Error(await r.text());
      showToast('Request submitted for admin approval', 'info');
      closeAdjModal();
      return;
    }

    // ── ADMIN PATH: apply immediately ───────────────────────────────────
    if (adjSelectedAction === 'sold') {
      if (isBoxUnit) {
        await patchBoxStock(adjProductId, locId, Math.max(0, curBox - rawQty), now);
        if (locId === 2) backBoxMap[adjProductId] = Math.max(0, curBox - rawQty);
        else mainBoxMap[adjProductId] = Math.max(0, curBox - rawQty);
      } else {
        await patchStock(adjProductId, locId, Math.max(0, curQty - rawQty), now);
        if (locId === 2) backStockMap[adjProductId] = Math.max(0, curQty - rawQty);
        else mainStockMap[adjProductId] = Math.max(0, curQty - rawQty);
      }
      await logMovement(adjProductId, locId, null, movQty, 'SALE', note);

    } else if (adjSelectedAction === 'to_front' || adjSelectedAction === 'to_back') {
      // Remove from current, add to other
      if (isBoxUnit) {
        await patchBoxStock(adjProductId, locId, Math.max(0, curBox - rawQty), now);
        await patchBoxStock(adjProductId, otherId, othBox + rawQty, now);
        if (locId === 2) { backBoxMap[adjProductId] = Math.max(0, curBox - rawQty); mainBoxMap[adjProductId] = othBox + rawQty; }
        else { mainBoxMap[adjProductId] = Math.max(0, curBox - rawQty); backBoxMap[adjProductId] = othBox + rawQty; }
      } else {
        await patchStock(adjProductId, locId, Math.max(0, curQty - rawQty), now);
        await patchStock(adjProductId, otherId, othQty + rawQty, now);
        if (locId === 2) { backStockMap[adjProductId] = Math.max(0, curQty - rawQty); mainStockMap[adjProductId] = othQty + rawQty; }
        else { mainStockMap[adjProductId] = Math.max(0, curQty - rawQty); backStockMap[adjProductId] = othQty + rawQty; }
      }
      await logMovement(adjProductId, locId, otherId, movQty, 'TRANSFER', note);

    } else if (adjSelectedAction === 'from_back' || adjSelectedAction === 'from_main') {
      // Remove from other, add to current
      if (isBoxUnit) {
        await patchBoxStock(adjProductId, otherId, Math.max(0, othBox - rawQty), now);
        await patchBoxStock(adjProductId, locId, curBox + rawQty, now);
        if (locId === 2) { backBoxMap[adjProductId] = curBox + rawQty; mainBoxMap[adjProductId] = Math.max(0, othBox - rawQty); }
        else { mainBoxMap[adjProductId] = curBox + rawQty; backBoxMap[adjProductId] = Math.max(0, othBox - rawQty); }
      } else {
        await patchStock(adjProductId, otherId, Math.max(0, othQty - rawQty), now);
        await patchStock(adjProductId, locId, curQty + rawQty, now);
        if (locId === 2) { backStockMap[adjProductId] = curQty + rawQty; mainStockMap[adjProductId] = Math.max(0, othQty - rawQty); }
        else { mainStockMap[adjProductId] = curQty + rawQty; backStockMap[adjProductId] = Math.max(0, othQty - rawQty); }
      }
      await logMovement(adjProductId, otherId, locId, movQty, 'TRANSFER', note);

    } else if (adjSelectedAction === 'stockin') {
      if (isBoxUnit) {
        await patchBoxStock(adjProductId, locId, curBox + rawQty, now);
        if (locId === 2) backBoxMap[adjProductId] = curBox + rawQty;
        else mainBoxMap[adjProductId] = curBox + rawQty;
      } else {
        await patchStock(adjProductId, locId, curQty + rawQty, now);
        if (locId === 2) backStockMap[adjProductId] = curQty + rawQty;
        else mainStockMap[adjProductId] = curQty + rawQty;
      }
      await logMovement(adjProductId, null, locId, movQty, 'ADJUSTMENT_IN', note);
    }

    const unitLabel = isBoxUnit ? `box${rawQty !== 1 ? 'es' : ''}` : `unit${rawQty !== 1 ? 's' : ''}`;
    const actionLabels = {
      sold: 'Sold', to_front: 'Moved to front store', to_back: 'Moved to back store',
      from_back: 'Moved from back store', from_main: 'Moved from main store', stockin: 'Stock added'
    };
    showToast(`✓ ${actionLabels[adjSelectedAction]} — ${rawQty} ${unitLabel}`, 'success');
    closeAdjModal();
    buildFilters();
    renderProducts();
  } catch(e) {
    showToast('Error: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Confirm';
  }
}

async function patchBoxStock(productId, locationId, newBoxQty, now) {
  const checkRes = await fetch(
    `${SUPABASE_URL}/rest/v1/stock_by_location?product_id=eq.${productId}&location_id=eq.${locationId}&select=id`,
    { headers: H }
  );
  const rows = await checkRes.json();
  if (rows && rows.length > 0) {
    await fetch(
      `${SUPABASE_URL}/rest/v1/stock_by_location?product_id=eq.${productId}&location_id=eq.${locationId}`,
      { method: 'PATCH', headers: H, body: JSON.stringify({ box_quantity: newBoxQty, updated_at: now }) }
    );
  } else {
    await fetch(
      `${SUPABASE_URL}/rest/v1/stock_by_location`,
      { method: 'POST', headers: H, body: JSON.stringify({ product_id: productId, location_id: locationId, quantity: 0, box_quantity: newBoxQty, updated_at: now }) }
    );
  }
}

async function patchStock(productId, locationId, newQty, now) {
  const checkRes = await fetch(
    `${SUPABASE_URL}/rest/v1/stock_by_location?product_id=eq.${productId}&location_id=eq.${locationId}&select=id`,
    { headers: H }
  );
  const rows = await checkRes.json();
  if (rows && rows.length > 0) {
    await fetch(
      `${SUPABASE_URL}/rest/v1/stock_by_location?product_id=eq.${productId}&location_id=eq.${locationId}`,
      { method: 'PATCH', headers: H, body: JSON.stringify({ quantity: newQty, updated_at: now }) }
    );
  } else {
    await fetch(
      `${SUPABASE_URL}/rest/v1/stock_by_location`,
      { method: 'POST', headers: H, body: JSON.stringify({ product_id: productId, location_id: locationId, quantity: newQty, updated_at: now }) }
    );
  }
}

async function logMovement(productId, fromLoc, toLoc, qty, type, reason) {
  await fetch(`${SUPABASE_URL}/rest/v1/stock_movements`, {
    method: 'POST', headers: H,
    body: JSON.stringify({
      product_id:       productId,
      from_location_id: fromLoc,
      to_location_id:   toLoc,
      quantity:         qty,
      movement_type:    type,
      reason:           reason,
      performed_by:     currentUserId,
      approved_by:      currentUserId,
      status:           'APPROVED'
    })
  });
}

// ── TOAST ─────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

init();
</script>
